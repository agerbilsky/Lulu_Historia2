<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 Integrador 4 · Historia Lulú</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1f;--card:#161628;--border:#2a2545;
  --accent:#2dd4bf;--accent2:#a78bfa;
  --correct:#34d399;--wrong:#f87171;
  --text:#ede9fe;--muted:#8b80a8;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;padding:20px 14px 60px}
header{text-align:center;margin-bottom:22px;width:100%;max-width:480px}
.back{display:inline-block;color:var(--accent);font-size:13px;font-weight:600;
  text-decoration:none;margin-bottom:14px;padding:6px 14px;border-radius:99px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
h1{font-size:clamp(24px,7vw,34px);font-weight:800;color:#fff;line-height:1.15;margin-bottom:8px}
.tag-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 6px}
.tag{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  border-radius:99px;padding:3px 11px;font-size:11px;color:var(--accent);font-weight:600}
.subtitle{color:var(--muted);font-size:12px;margin-top:4px}
.pw{width:100%;max-width:480px;margin-bottom:16px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.pt{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;transition:width .4s ease}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:22px 18px;width:100%;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.qn{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px}
.qt{font-size:clamp(15px,4vw,18px);font-weight:700;line-height:1.45;margin-bottom:20px;color:#fff}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:transparent;border:1.5px solid var(--border);border-radius:13px;
  padding:13px 14px;color:var(--text);font-family:inherit;font-size:14px;text-align:left;
  cursor:pointer;display:flex;align-items:flex-start;gap:11px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:border-color .15s,background .15s;width:100%}
.opt:active:not(:disabled){background:rgba(255,255,255,0.05)}
.ol{width:26px;height:26px;min-width:26px;border-radius:50%;background:var(--border);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  transition:background .2s;flex-shrink:0}
.opt.correct{border-color:var(--correct);background:rgba(52,211,153,.08)}
.opt.correct .ol{background:var(--correct);color:#0d1f17}
.opt.wrong{border-color:var(--wrong);background:rgba(248,113,113,.08)}
.opt.wrong .ol{background:var(--wrong);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13px;
  line-height:1.55;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.25);color:#6ee7b7}
.fb.bad{background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.25);color:#fca5a5}
.bn{margin-top:16px;width:100%;padding:15px;border-radius:13px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bn.show{display:block}
.results{display:none;width:100%;max-width:480px}
.results.show{display:block}
.rc{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:36px 18px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.sr{width:110px;height:110px;border-radius:50%;
  background:conic-gradient(var(--accent) var(--pct,0%),var(--border) 0);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative}
.sr::before{content:'';width:80px;height:80px;border-radius:50%;
  background:var(--card);position:absolute}
.sn{font-size:24px;font-weight:800;position:relative;z-index:1;color:#fff}
.rc h2{font-size:20px;font-weight:700;margin-bottom:6px;color:#fff}
.rc>p{color:var(--muted);font-size:13px;margin-bottom:22px}
.rl{text-align:left;display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.ri{padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.5;border:1px solid}
.ri.ok{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}
.ri.fail{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06)}
.ri .rlab{font-weight:600;display:block;margin-bottom:2px}
.ri.ok .rlab{color:#6ee7b7}.ri.fail .rlab{color:#fca5a5}
.ri .rans{color:var(--muted);font-size:11px}
.br{width:100%;padding:15px;border-radius:13px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.br.rev{background:linear-gradient(135deg,var(--wrong),#fb923c);
  margin-bottom:10px;display:none}
.br.rev.show{display:block}
.repaso-chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#fb923c;background:rgba(251,146,60,.12);
  border:1px solid rgba(251,146,60,.3);border-radius:99px;padding:3px 10px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <a href="index.html?v=20261101-3" class="back">← Volver al inicio</a>
  <div class="eyebrow">Historia · Integrador · Las 15 preguntas</div>
  <h1>🌟 Integrador 4</h1>
  <div class="tag-row"><span class="tag">📚 Preguntas 1 a 15</span><span class="tag">✅ Las clave</span></div>
  <p class="subtitle">20 preguntas · Basado en la guía y el material del profe</p>
</header>
<div class="pw">
  <div class="pm"><span id="pt">Pregunta 1 de 20</span><span id="st">0 correctas</span></div>
  <div class="pt"><div class="pf" id="pf" style="width:8%"></div></div>
</div>
<div class="card" id="qcard">
  <div class="qn" id="qn">Pregunta 1</div>
  <div class="qt" id="qt"></div>
  <div class="opts" id="qo"></div>
  <div class="fb" id="fb"></div>
  <button class="bn" id="bn">Siguiente →</button>
</div>
<div class="results" id="res">
  <div class="rc">
    <div class="sr" id="sr"><span class="sn" id="sf"></span></div>
    <h2 id="rt"></h2><p id="rs"></p>
    <div class="rl" id="rl"></div>
    <button class="br rev" id="brev" onclick="init(FALLIDAS)">🎯 Repasar mis errores</button>
    <button class="br" id="bfull" onclick="init()">🔁 Intentar de nuevo</button>
  </div>
</div>
<script>
var Q=[{"q": "Según Noemí Goldman, ¿cómo hay que entender a las provincias que surgieron desde 1820?", "opts": ["Como Estados independientes que hasta firmaban tratados entre sí", "Como pedazos de una nación que ya existía y se había roto", "Como departamentos administrados desde la ciudad de Buenos Aires", "Como colonias que todavía dependían del rey de España"], "ans": 0, "exp": "Para Goldman no fueron restos de una nación rota: funcionaron como Estados independientes, aunque siguieron llamándose «provincias»."}, {"q": "En las repúblicas provinciales, ¿quién elegía al gobernador?", "opts": ["El Cabildo de la ciudad cabecera, como en la colonia", "Un Congreso con diputados de todas las provincias", "La Junta o Sala de Representantes de la provincia", "El gobernador de Buenos Aires, por el Pacto Federal"], "ans": 2, "exp": "La Sala de Representantes era el Poder Legislativo local: sus diputados se votaban y ellos elegían al gobernador."}, {"q": "¿Qué provincias del Litoral formaron el Pacto Federal de 1831?", "opts": ["Córdoba, Tucumán, Salta, Jujuy y La Rioja", "Buenos Aires, Córdoba, Mendoza y Santiago del Estero", "Mendoza, San Juan, San Luis y La Rioja", "Buenos Aires, Santa Fe, Entre Ríos y Corrientes"], "ans": 3, "exp": "Fue una alianza del Litoral. El 4 de enero de 1831 firmaron Buenos Aires, Santa Fe y Entre Ríos, y Corrientes adhirió ese mismo año."}, {"q": "¿Qué nombre tomó la unión de las provincias que fueron adhiriendo al Pacto Federal?", "opts": ["Liga de los Pueblos Libres", "República de Entre Ríos", "Confederación Argentina", "Provincias Unidas de Sudamérica"], "ans": 2, "exp": "Con la adhesión de los gobiernos provinciales al pacto nació lo que se empezó a llamar Confederación Argentina."}, {"q": "¿Qué resultado tuvo el plebiscito de marzo de 1835?", "opts": ["Votaron solo los diputados de la Sala de Representantes", "Una elección pareja que ganó por apenas 300 votos", "Más de 9.000 votos a favor y menos de 10 en contra", "Perdió y tuvo que gobernar sin facultades especiales"], "ans": 2, "exp": "Fue un resultado aplastante. A partir de ahí, estar públicamente en desacuerdo con el gobierno se volvió peligroso."}, {"q": "¿En qué consistía la «lista única» de candidatos?", "opts": ["Rosas armaba la lista y controlaba las mesas de votación", "Cada barrio presentaba sus candidatos con total libertad", "Los unitarios tenían su propia lista en cada elección", "La armaban entre la Iglesia y los jueces de paz de campaña"], "ans": 0, "exp": "Así la Sala solo tenía diputados afines. Ese control se formalizó en 1838."}, {"q": "¿Qué argumento daba Rosas para no dictar una constitución?", "opts": ["Que el Pacto Federal prohibía expresamente tener constitución", "Que ya existía una constitución aprobada por todas las provincias", "Que el Imperio del Brasil no permitía que hubiera constitución", "Que las provincias no estaban preparadas para formar una nación"], "ans": 3, "exp": "Decía que convenía manejarse con pactos hasta que hubiera paz. Detrás de eso estaban los intereses de los sectores poderosos de Buenos Aires."}, {"q": "En 1819 Rosas escribió unas «Instrucciones» para imponer mano dura en sus estancias. ¿Por qué no pudo aplicarlas?", "opts": ["Porque los sindicatos rurales le hacían huelgas muy fuertes", "Porque faltaba mano de obra y la gente podía vivir por su cuenta", "Porque sus peones eran esclavos que no se podían ir", "Porque el gobierno de Buenos Aires se lo prohibió por ley"], "ans": 1, "exp": "Había mucha tierra y poca gente. Los trabajadores eran escasos y caros, y Rosas tuvo que negociar y tolerar a los ocupantes."}, {"q": "En su discurso político, ¿qué destacaba siempre Rosas?", "opts": ["La necesidad de un gobierno unitario", "La unión con el Imperio del Brasil", "La libertad de prensa y de reunión", "La autonomía de las provincias"], "ans": 3, "exp": "Decía defender la autonomía, pero en la práctica controlaba a los gobiernos provinciales. Ahí está la ambigüedad."}, {"q": "¿Por qué Urquiza se puso en contra de Rosas?", "opts": ["Quería ser nombrado gobernador de Buenos Aires en lugar de Rosas", "Lo perjudicaba el monopolio porteño de la Aduana y los ríos", "Era un unitario de toda la vida y odiaba a los federales", "Rosas le había confiscado todas sus estancias en Entre Ríos"], "ans": 1, "exp": "Entre Ríos se estaba recuperando económicamente y Urquiza era un gran estanciero, perjudicado por la política económica rosista."}, {"q": "¿Qué países se sumaron a la coalición contra Rosas?", "opts": ["Chile y Bolivia", "Paraguay y Perú", "Francia e Inglaterra", "Uruguay y el Brasil"], "ans": 3, "exp": "Los dos estaban en conflicto con Buenos Aires en ese momento."}, {"q": "En la década de 1850, ¿en qué dos bloques quedó dividido el país?", "opts": ["La Confederación (capital Paraná) y el Estado de Buenos Aires", "El Litoral, unido al Brasil, y las provincias del interior", "Los unitarios en Córdoba y los federales en Buenos Aires", "Buenos Aires con capital en Rosario y el resto en Paraná"], "ans": 0, "exp": "Buenos Aires rechazó el Acuerdo de San Nicolás y la Constitución de 1853, y se separó."}, {"q": "¿Cómo murió el Chacho Peñaloza?", "opts": ["Lo asesinaron en Olta en 1863 y exhibieron su cabeza", "Murió exiliado en Chile en 1870, ya muy anciano", "Cayó en la Guerra del Paraguay como general del ejército", "Lo fusilaron en Caseros junto con los oficiales de Rosas"], "ans": 0, "exp": "Lo alcanzaron en Olta, La Rioja, el 12 de noviembre de 1863."}, {"q": "¿Qué denunciaba Felipe Varela en su proclama de 1867?", "opts": ["La construcción del Ferrocarril Oeste por los ingleses", "La llegada masiva de inmigrantes europeos al país", "La Guerra del Paraguay y las levas forzosas en el interior", "La federalización de la ciudad de Buenos Aires en 1880"], "ans": 2, "exp": "Varela veía la guerra como una lucha entre hermanos y denunciaba la brutalidad de reclutar gente a la fuerza."}, {"q": "¿Por qué Paraguay le declaró la guerra a la Argentina en 1865?", "opts": ["Porque la Argentina invadió Asunción sin ningún aviso previo", "Porque la Argentina se negó a seguir comprándole yerba mate", "Porque Mitre le negó el permiso para cruzar territorio argentino", "Porque Mitre primero lo apoyó y después lo traicionó en Uruguay"], "ans": 2, "exp": "Solano López quería llegar a Uruguay pasando por Corrientes. Mitre dijo que la Argentina era neutral y se lo negó."}, {"q": "¿Qué creó Sarmiento para formar oficiales profesionales?", "opts": ["La Mazorca y la Sociedad Popular Restauradora", "El Colegio Militar y la Escuela Naval", "El Museo de La Plata y el Hotel de Inmigrantes", "El Banco de la Nación y la Aduana de Buenos Aires"], "ans": 1, "exp": "El ejército regular nació con Mitre. Después, Sarmiento fundó el Colegio Militar y la Escuela Naval."}, {"q": "¿Qué pasó con las tierras conquistadas?", "opts": ["Se dividieron en parcelas chicas, una para cada familia indígena", "Se les entregaron gratis a todos los inmigrantes que llegaban", "Quedaron protegidas como parques nacionales sin ningún dueño", "Se repartieron entre militares y fueron a grandes terratenientes"], "ans": 3, "exp": "Los militares que participaron vendieron las tierras a terratenientes, que concentraron así enormes propiedades."}, {"q": "¿Qué ideas centrales tenía el positivismo?", "opts": ["Respetar por igual a todas las culturas y a todas sus tradiciones", "Ciencia, «orden y progreso» y civilización contra barbarie", "Volver al orden colonial y devolverle todo el poder al rey de España", "Rechazar la ciencia y defender las costumbres del campo"], "ans": 1, "exp": "Creía que la historia avanzaba en línea recta hacia la «civilización». Para esas ideas, los europeos eran los «civilizados»."}, {"q": "¿Quiénes impulsaron la construcción de los ferrocarriles?", "opts": ["El Estado y, sobre todo, los inversores ingleses", "Los inmigrantes italianos, con sus propios ahorros", "Los Estados Unidos y Francia, en partes iguales", "Las provincias del interior, con sus propias aduanas"], "ans": 0, "exp": "Gran Bretaña fue el principal inversor en la Argentina de esa época."}, {"q": "¿Qué estableció la Ley 1420 de 1884?", "opts": ["Escuelas en idioma italiano para todos los hijos de inmigrantes", "Primaria obligatoria, gratuita y laica, para una identidad común", "Escuelas religiosas pagas, una en cada provincia del país", "Universidad gratuita, pero solamente para los varones"], "ans": 1, "exp": "La escuela enseñaba el idioma, la historia nacional, los próceres y los símbolos patrios, para «argentinizar» a los hijos de los inmigrantes."}];
var ALL=Q,cur=0,score=0,ans=[],T=Q.length,FALLIDAS=[],repaso=false;
function init(set){
  var usar=(set&&set.length)?set:ALL;
  repaso=usar.length<ALL.length;
  Q=usar;T=Q.length;cur=0;score=0;ans=[];
  document.getElementById('qcard').style.display='block';
  document.getElementById('res').className='results';render()}
function render(){
  var q=Q[cur];
  document.getElementById('qn').innerHTML=(repaso?'<span class="repaso-chip">🎯 Repaso de errores</span><br>':'')+'Pregunta '+(cur+1);
  document.getElementById('qt').textContent=q.q;
  document.getElementById('pt').textContent='Pregunta '+(cur+1)+' de '+T;
  document.getElementById('st').textContent=score+(score!==1?' correctas':' correcta');
  document.getElementById('pf').style.width=(Math.round((cur/T)*100)+8)+'%';
  var fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
  document.getElementById('bn').className='bn';
  var c=document.getElementById('qo');c.innerHTML='';
  var L=['A','B','C','D'];
  for(var i=0;i<q.opts.length;i++){(function(idx){
    var b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="ol">'+L[idx]+'</span><span>'+q.opts[idx]+'</span>';
    b.addEventListener('click',function(){pick(idx)});c.appendChild(b);
  })(i)}
}
function pick(idx){
  var q=Q[cur];
  var bs=document.querySelectorAll('.opt');
  for(var i=0;i<bs.length;i++)bs[i].disabled=true;
  var ok=idx===q.ans;if(ok)score++;
  ans.push({q:q.q,chosen:idx,ans:q.ans,ok:ok,opts:q.opts});
  bs[q.ans].className+=' correct';if(!ok)bs[idx].className+=' wrong';
  var fb=document.getElementById('fb');
  fb.innerHTML=ok?'✅ ¡Correcto! '+q.exp:'❌ Incorrecto. La correcta era: '+q.opts[q.ans]+'. '+q.exp;
  fb.className='fb show '+(ok?'ok':'bad');
  var bn=document.getElementById('bn');
  bn.textContent=cur<T-1?'Siguiente →':'Ver resultados 🎉';bn.className='bn show';
}
document.getElementById('bn').addEventListener('click',function(){
  cur++;if(cur<T)render();else showRes();
});
function showRes(){
  document.getElementById('qcard').style.display='none';
  document.getElementById('res').className='results show';
  var pct=Math.round((score/T)*100);
  document.getElementById('sr').style.setProperty('--pct',pct+'%');
  document.getElementById('sf').textContent=score+'/'+T;
  var ti,su;
  if(score===T){ti=repaso?'¡Corregidas! 🌟':'¡Perfecto! 🌟';su=repaso?'Te salieron todas las que antes fallabas.':''+T+'/'+T+'. ¡Lo tenés clavado!'}
  else if(score>=T*.8){ti='¡Muy bien! 💪';su='Casi todo bien. Repasá las que fallaste.'}
  else if(score>=T*.6){ti='Bien, podés mejorar 📚';su='Más de la mitad bien. Vale repasar.'}
  else{ti='A repasar 😅';su='No te preocupes, con otro repaso va a quedar. 💜'}
  document.getElementById('rt').textContent=ti;document.getElementById('rs').textContent=su;
  var rl=document.getElementById('rl');rl.innerHTML='';
  FALLIDAS=[];
  for(var i=0;i<ans.length;i++){
    var a=ans[i];if(!a.ok)FALLIDAS.push(Q[i]);
    var d=document.createElement('div');d.className='ri '+(a.ok?'ok':'fail');
    var h='<span class="rlab">'+(a.ok?'✅':'❌')+' P'+(i+1)+': '+a.q+'</span>';
    if(!a.ok)h+='<span class="rans">Tu respuesta: '+a.opts[a.chosen]+' · Correcta: '+a.opts[a.ans]+'</span>';
    d.innerHTML=h;rl.appendChild(d);
  }
  var brev=document.getElementById('brev');
  if(FALLIDAS.length){brev.className='br rev show';
    brev.textContent='🎯 Repasar mis errores ('+FALLIDAS.length+')';}
  else{brev.className='br rev';}
  document.getElementById('bfull').textContent=repaso?'🔁 Hacer el examen completo':'🔁 Intentar de nuevo';
  guardar();
}
try{var _b=document.querySelector('.back');
    if(_b)_b.href='index.html?v='+Math.floor(Date.now()/864e5);}catch(e){}
function guardar(){
  if(repaso)return;                       // el repaso no cuenta como nota
  try{
    var k='lulu:'+location.pathname.split('/').pop().replace('.html','');
    var p={};try{p=JSON.parse(localStorage.getItem(k))||{}}catch(e){}
    localStorage.setItem(k,JSON.stringify({
      total:ALL.length,
      ultimo:score,
      mejor:Math.max(p.mejor||0,score),
      intentos:(p.intentos||0)+1,
      fecha:new Date().toISOString().slice(0,10)
    }));
  }catch(e){}                              // si el navegador lo bloquea, sigue andando igual
}
init();
</script>
</body>
</html>
